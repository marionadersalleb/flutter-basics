name: contacts_app
description: Route Mobile Diploma - Task Three - Contacts App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # named in the brief: "this Animations is Placed Using Lottie
  # Animations Packages"
  lottie: ^3.1.2

  # named in the brief: "You Can Use image_picker package to select
  # image from gallery"
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
