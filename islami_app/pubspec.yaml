name: islami
description: Route Mobile Diploma - Islami App - Onboarding & Sebha
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # named in the task sheet: "Indicators: Used SmoothPageIndicator"
  smooth_page_indicator: ^1.2.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # The Janna LT font file is not included in this repository (its license
  # is unclear). The app falls back to the default font without it.
  # To use it, put `Janna LT Bold.ttf` in assets/fonts/ and uncomment:
  #
  # fonts:
  #   - family: Janna LT
  #     fonts:
  #       - asset: assets/fonts/Janna LT Bold.ttf
  #         weight: 700
